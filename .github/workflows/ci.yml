name: CI

on:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: urbanopt-des
      - name: Check if geojson-modelica-translator needs to be checked out
        id: check_gmt
        working-directory: urbanopt-des
        run: |
          if grep -E '^[^#]*geojson-modelica-translator.*path.*=.*"\.\./' pyproject.toml; then
            echo "needs_checkout=true" >> $GITHUB_OUTPUT
          else
            echo "needs_checkout=false" >> $GITHUB_OUTPUT
          fi
      - name: Checkout geojson-modelica-translator
        if: steps.check_gmt.outputs.needs_checkout == 'true'
        uses: actions/checkout@v7
        with:
          repository: urbanopt/geojson-modelica-translator
          ref: develop
          path: geojson-modelica-translator
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve URBANopt CLI release from wrapper version
        id: urbanopt_cli
        working-directory: urbanopt-des
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          from urbanopt_des.uo_cli_wrapper import UOCliWrapper

          default_version = UOCliWrapper.DEFAULT_UO_VERSION
          version = os.environ.get("URBANOPT_CLI_VERSION", default_version).strip().removeprefix("v") or default_version
          release_tag = f"v{version}"
          release_url = f"https://api.github.com/repos/urbanopt/urbanopt-cli/releases/tags/{release_tag}"

          request = urllib.request.Request(release_url)
          request.add_header("Accept", "application/vnd.github+json")
          request.add_header("X-GitHub-Api-Version", "2022-11-28")
          # Authenticate with the Actions-provided token so parallel jobs don't
          # trip the unauthenticated GitHub API rate limit (60 requests/hour/IP).
          token = os.environ.get("GITHUB_TOKEN")
          if token:
              request.add_header("Authorization", f"Bearer {token}")

          last_error = None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(request) as response:
                      release = json.load(response)
                  break
              except urllib.error.HTTPError as exc:
                  last_error = exc
                  # Retry only on transient responses (rate limiting / server errors).
                  if exc.code in (403, 429) or exc.code >= 500:
                      time.sleep(5 * (attempt + 1))
                      continue
                  raise SystemExit(f"Could not find URBANopt CLI release {release_tag}: {exc}") from exc
          else:
              raise SystemExit(f"Could not fetch URBANopt CLI release {release_tag} after retries: {last_error}")

          asset = next(
              asset
              for asset in release["assets"]
              if asset["name"].endswith("Ubuntu-22.04-x86_64.deb")
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as github_output:
              print(f"version={version}", file=github_output)
              print(f"asset_url={asset['browser_download_url']}", file=github_output)
          PY
      - name: Install URBANopt CLI ${{ steps.urbanopt_cli.outputs.version }}
        run: |
          curl -fsSL "${{ steps.urbanopt_cli.outputs.asset_url }}" -o /tmp/urbanopt-cli.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/urbanopt-cli.deb
          echo "URBANOPT_CLI_VERSION=${{ steps.urbanopt_cli.outputs.version }}" >> "$GITHUB_ENV"
          cli_root="/usr/local/urbanopt-cli-${{ steps.urbanopt_cli.outputs.version }}"
          # The .deb installs as root, but `uo install_python` needs to write python_config.json
          # and the Miniconda deps under the CLI directory. Hand ownership to the runner user.
          sudo chown -R "$(id -un):$(id -gn)" "$cli_root"
          echo "$cli_root/ruby/bin" >> "$GITHUB_PATH"
          echo "$cli_root/gems/ruby/3.2.0/bin" >> "$GITHUB_PATH"
          export GEM_HOME="$cli_root/gems/ruby/3.2.0"
          export GEM_PATH="$GEM_HOME"
          export UO_GEMFILE_PATH="$cli_root/gems/Gemfile"
          export UO_BUNDLE_INSTALL_PATH="$cli_root/gems"
          export PATH="$cli_root/ruby/bin:$cli_root/gems/ruby/3.2.0/bin:$PATH"
          export RUBYLIB="$cli_root/OpenStudio/Ruby"
          export RUBY_DLL_PATH="$cli_root/OpenStudio/Ruby"
          uo --version
      - name: Set up uv
        # URBANopt CLI 1.3.0+ shells out to `uv` for its Python tool dependencies
        # (`uo install_python`); without uv on PATH the CLI aborts.
        uses: astral-sh/setup-uv@v8.3.2
      - name: Install Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: "latest"
      - name: Install dependencies
        working-directory: urbanopt-des
        run: |
          python -m pip install --upgrade pip
          poetry install --no-root
      - name: Run pre-commit
        working-directory: urbanopt-des
        run: poetry run pre-commit run --all-files
      - name: Run mypy
        working-directory: urbanopt-des
        run: poetry run mypy urbanopt_des
      - name: Run pytest
        working-directory: urbanopt-des
        # URBANopt CLI 1.3.0 builds DES system-parameter files in an isolated
        # `uv tool run --from urbanopt-des==0.2.0`. urbanopt-des 0.2.0 pins
        # geojson-modelica-translator (GMT) >=0.13.0,<0.14.0, so uv resolves GMT 0.13.0.
        # GMT only gained 5G ETS pump-flow sizing (ets_pump_flow_rate) in 0.15.0, so the
        # pinned toolchain leaves ets_pump_flow_rate at the 0.0005 template default and the
        # 5G from-scratch integration tests fail. Use uv's override mechanism to force the
        # newer GMT for the CLI's isolated tool env. This propagates through the wrapper's
        # subprocess environment into `uo des_params`/`install_python`.
        # TODO: remove once a URBANopt CLI release bumps its bundled urbanopt-des pin to a
        # version that requires GMT >=0.15.0 (tracking issue in urbanopt-des).
        env:
          UV_OVERRIDE: ${{ github.workspace }}/uv-overrides.txt
        run: |
          echo "geojson-modelica-translator>=0.15.0,<0.16.0" > "$UV_OVERRIDE"
          poetry run pytest -v --cov-report term-missing --cov
