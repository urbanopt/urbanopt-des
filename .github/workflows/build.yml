name: Test Build of Python Package

on: push

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Check if using local GMT checkout
        id: check_gmt
        run: |
          if grep -E '^[^#]*geojson-modelica-translator.*path.*=.*"\.\./' pyproject.toml; then
            echo "using_local=true" >> $GITHUB_OUTPUT
          else
            echo "using_local=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Python
        if: steps.check_gmt.outputs.using_local == 'false'
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Poetry
        if: steps.check_gmt.outputs.using_local == 'false'
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: "latest"
      - name: Install dependencies
        if: steps.check_gmt.outputs.using_local == 'false'
        run: |
          python -m pip install --upgrade pip
          poetry install
      - name: Build package
        if: steps.check_gmt.outputs.using_local == 'false'
        run: poetry build
