[tool.poetry]
name = "urbanopt-des"
version = "0.2.0"
description = ""
authors = ["Nicholas Long <nicholas.long@nlr.gov>"]
readme = "README.md"
packages = [{ include = "urbanopt_des", from = "." }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
cyclopts = "^4.21.0"

# Note, in the past, the we had to keep geopandas below 1.0 to keep Shapely <2.0,
# which avoided conflicts with nrel-disco's requirements (via pydss). 
# This should have been resolved with downstream dependencies and we can now use 
# our desired version of geopandas
geopandas = "^1.1.4"

# release mode
geojson-modelica-translator = "^0.15.0"
# pre-release mode, use github
# geojson-modelica-translator = { git = "https://github.com/urbanopt/geojson-modelica-translator.git", branch = "develop" }
# dev mode
# geojson-modelica-translator = { path = "../geojson-modelica-translator", develop = true }

[tool.poetry.group.dev.dependencies]
pre-commit = "~=4.6"
mypy = "~2.2"
pytest = "~=9.1"
pytest-cov = "~7.1"
buildingspy = "^5.2.0"

[tool.poetry.scripts]
des-output = "urbanopt_des.cli:app"

[tool.mypy]
# Exclude directories and files that need type fixing
exclude = [
	"urbanopt_des/measures/",
	"urbanopt_des/activity_to_osa/",
]
ignore_missing_imports = true
# Start with permissive settings - can be tightened incrementally
disallow_untyped_defs = false
# Still catch some useful errors
warn_return_any = false
warn_unused_ignores = true
# Don't require complete type coverage yet
check_untyped_defs = false

[tool.pytest.ini_options]
filterwarnings = [
	"ignore:The 'shapely.geos' module is deprecated.*:DeprecationWarning:geopandas._compat",
]

[build-system]
requires = ["poetry-core>=2.0.1"]
build-backend = "poetry.core.masonry.api"
